plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)


minecraft {

    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        copyIdeResources = true

        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "$mod_id" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "$mod_id" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run/server')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "$mod_id" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources')

            mods {
                "$mod_id" {
                    source sourceSets.main
                }
            }
        }
    }
}



repositories {
    mavenLocal()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
    maven {
        url = "https://api.modrinth.com/maven"
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation(name: 'Concentus-1.0-SNAPSHOT', ext: 'jar')
}

shadowJar {
    archiveClassifier.set("")
    relocate 'org.concentus', 'net.lixir.vminus.shadow.concentus'
    configurations = [project.configurations.shadow]
}

mixin {
    add(sourceSets.main, "mixins.vminus.refmap.json")
    config "mixins.vminus.json"

    debug {
        verbose = true
        export = true
    }

    dumpTargetOnFailure = true
    quiet = true
}


jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : "1",
                'groupId'                 : mod_group_id,
                'artifactId'              : mod_id,
                'Implementation-Title'   : mod_id,
                'Implementation-Version' : mod_version,
                'Implementation-Vendor'  : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('fatJar', Jar) {
    dependsOn shadowJar
    archiveClassifier.set('all')

    from {
        zipTree(shadowJar.archiveFile.get().asFile)
    }

    manifest {
        attributes jar.manifest.attributes
    }
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            artifact jar
        }
    }
    repositories {
        maven {
            url file("${project.rootDir}/mcmodsrepo")
        }
    }
}